name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update cPanel repo and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ~/repositories/abufire-site
            git fetch origin main
            git reset --hard origin/main
            out=$(uapi --output=json VersionControlDeployment create repository_root=$HOME/repositories/abufire-site)
            echo "$out"
            echo "$out" | grep -q '"status":1' || { echo "cPanel deployment failed"; exit 1; }
